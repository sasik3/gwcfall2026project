
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Your CS Match!</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <h1>Find your CS match!</h1>

    <p>
        Not sure where to start? Take our quick quiz to discover
        CS opportunities that fit your interests and goals!
    </p>

    <div class="quiz-container">

        <div class="question-card">

            <p class="progress">Question 1/5</p>

            <h2>What's your coding experience?</h2>

            <div class="answer-options">

                <button>
                    <span class="choice-letter">A</span>
                    <span>I'm completely new to coding</span>
                </button>

                <button>
                    <span class="choice-letter">B</span>
                    <span>I know some basic programming</span>
                </button>

                <button>
                    <span class="choice-letter">C</span>
                    <span>I've built a few coding projects</span>
                </button>

                <button>
                    <span class="choice-letter">D</span>
                    <span>I'm an experienced programmer</span>
                </button>

            </div>

        </div>

    </div>

</body>
</html>
